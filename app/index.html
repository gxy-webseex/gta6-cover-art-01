<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Studio</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="preview">
    <canvas id="cover" width="1080" height="1080" aria-label="The cover preview"></canvas>
    <p class="hint">Click a panel to select it, then drag it to reposition its photo.</p>
  </section>
  <section class="controls">
    <h1>Vice Cover Studio</h1>
    <p class="tag">Turn a photo and a caption into GTA-style poster art.</p>
    <div class="group">
      <label>Photos <input id="photos" type="file" accept="image/*" multiple></label>
      <div class="samples">
        <button type="button" data-sample="boulevard">Sample: Boulevard</button>
        <button type="button" data-sample="pier">Sample: Pier</button>
      </div>
      <div id="thumbs" class="thumbs" aria-label="Loaded photos"></div>
    </div>
    <div class="group">
      <span class="label">Panel</span>
      <div class="seg" id="panelPicker">
        <button type="button" data-panel="hero" class="on">Hero</button>
        <button type="button" data-panel="a">Panel A</button>
        <button type="button" data-panel="b">Panel B</button>
      </div>
      <label>Zoom <input id="zoom" type="range" min="1" max="3" step="0.05" value="1"></label>
    </div>
    <div class="group">
      <label>Title <input id="title" type="text" maxlength="30" value="Sunset Heist"></label>
      <label>Subtitle <input id="subtitle" type="text" maxlength="40" value="One last score"></label>
      <label>Title size <input id="titleSize" type="range" min="0.7" max="1.3" step="0.05" value="1"></label>
    </div>
    <div class="group">
      <span class="label">Colour grade</span>
      <div class="seg" id="gradePicker">
        <button type="button" data-grade="sunset" class="on">Sunset</button>
        <button type="button" data-grade="neon">Neon</button>
        <button type="button" data-grade="noir">Noir</button>
        <button type="button" data-grade="none">Original</button>
      </div>
    </div>
    <div class="group">
      <span class="label">Export size</span>
      <div class="seg" id="sizePicker">
        <button type="button" data-size="0" class="on">1080 × 1080</button>
        <button type="button" data-size="1">1080 × 1350</button>
        <button type="button" data-size="2">1920 × 1080</button>
      </div>
    </div>
    <button id="export" type="button" class="export">Export PNG</button>
    <p id="status" role="status"></p>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
